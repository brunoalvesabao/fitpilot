# Configuração do Firebase App Hosting para este app Next.js.
# Documentação: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0

env:
  # Públicas: o Next.js embute essas no bundle do navegador, então não
  # precisam ser secret (a anon key do Supabase é segura para expor
  # no client — a segurança real vem das políticas de RLS no banco).
  - variable: NEXT_PUBLIC_SUPABASE_URL
    value: "COLE_AQUI_A_URL_DO_SEU_PROJETO_SUPABASE"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    value: "COLE_AQUI_A_ANON_KEY_DO_SEU_PROJETO_SUPABASE"
    availability:
      - BUILD
      - RUNTIME

  # Secreta: a chave do Gemini nunca deve aparecer em texto puro aqui.
  # Crie o secret antes do deploy com:
  #   firebase apphosting:secrets:set GEMINI_API_KEY
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
